<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Articles on technology, learning and computer science by Hammad Shahzad."><title>Admin | Hammad Shahzad</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/blog.css"></head><body><div class="container"><nav class="blog-nav" aria-label="Main navigation"><a href="/index.html">HS. / Portfolio</a><a href="/blog.html">Journal</a><a href="/admin.html">Admin</a></nav><main class="blog-main"><p class="blog-eyebrow">Admin studio</p><h1>Your next idea starts here.</h1><p id="message" class="notice" role="status" aria-live="polite">Connecting…</p><form id="login" class="editor login" hidden><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="btn btn-primary">Sign in</button><button type="button" id="reset" class="btn btn-secondary">Send password reset email</button></form><div id="dashboard" hidden><div class="actions"><button id="new" class="btn btn-primary">New article</button><button id="logout" class="btn btn-secondary">Sign out</button></div><div id="my-posts"></div><h2 id="editor-title">New article</h2><form id="editor" class="editor"><label>Title<input name="title" maxlength="160" required></label><label>Short summary<textarea name="excerpt" maxlength="400" rows="3" required></textarea></label><label>Category<input name="category" maxlength="60" value="Technology" required></label><label>Cover image URL (optional, HTTPS)<input name="coverUrl" type="url" placeholder="https://…"></label><label>YouTube URL (optional)<input name="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=…"></label><label>Article<textarea name="body" rows="16" maxlength="80000" placeholder="# Heading&#10;Write paragraphs here. Use ## for subheadings and - for bullet points." required></textarea></label><label>Visibility<select name="status"><option value="draft">Draft — only admin can read</option><option value="published">Published — everyone can read</option></select></label><div class="actions"><button class="btn btn-primary" id="save">Save article</button><button type="button" id="preview-button" class="btn btn-secondary">Preview</button></div></form><article id="preview" class="preview article" hidden></article></div></main><footer class="blog-footer muted">Hammad Shahzad · Notes on learning, code &amp; teaching.</footer></div><script type="module" src="/blog/admin.js"></script></body></html>
